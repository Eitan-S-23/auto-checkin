name: migrate-secrets

# 临时任务：把本仓库 ACCOUNTS_JSON 的值改名写入 GLADOS_ACCOUNTS_JSON（合并后的面板命名），完成后删除。
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Rename ACCOUNTS_JSON to GLADOS_ACCOUNTS_JSON
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_PAT }}
          SRC_ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$SRC_ACCOUNTS_JSON" ]; then echo "ACCOUNTS_JSON 为空，跳过"; exit 0; fi
          gh secret set GLADOS_ACCOUNTS_JSON -R "Eitan-S-23/glados-auto-checkin" --body "$SRC_ACCOUNTS_JSON"
          echo "已写入 GLADOS_ACCOUNTS_JSON"
