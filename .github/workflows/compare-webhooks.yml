name: compare-webhooks

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: 比较通知地址变量（只输出 SET/EMPTY 与 SAME/DIFF，不输出值）
        env:
          A: ${{ secrets.PUSH_WEBHOOK_URL }}
          B: ${{ secrets.RAILGUN_PUSH_WEBHOOK_URL }}
          C: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          [ -n "$A" ] && echo "PUSH_WEBHOOK_URL: SET" || echo "PUSH_WEBHOOK_URL: EMPTY"
          [ -n "$B" ] && echo "RAILGUN_PUSH_WEBHOOK_URL: SET" || echo "RAILGUN_PUSH_WEBHOOK_URL: EMPTY"
          [ -n "$C" ] && echo "WECOM_WEBHOOK: SET" || echo "WECOM_WEBHOOK: EMPTY"
          [ "$A" = "$B" ] && echo "PUSH vs RAILGUN: SAME" || echo "PUSH vs RAILGUN: DIFF"
          [ "$C" = "$B" ] && echo "WECOM vs RAILGUN: SAME" || echo "WECOM vs RAILGUN: DIFF"
          [ "$A" = "$C" ] && echo "PUSH vs WECOM: SAME" || echo "PUSH vs WECOM: DIFF"
