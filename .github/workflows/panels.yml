name: panels-checkin

on:
  push:
    branches: [main]
    paths: ['.github/panels-checkin.trigger']
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 仅查询账号状态，不签到、不推送、不修改 Secret
        type: boolean
        default: false
      verify_only:
        description: 仅检查 GLaDOS 浏览器验证，不签到、不登录、不推送
        type: boolean
        default: false

concurrency:
  group: panels-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[panels-checkin]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/.cache/panels/deps
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/panels/pip
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      SSLKEYLOGFILE: ''
      TMPDIR: ${{ github.workspace }}/.cache/panels/tmp
      TMP: ${{ github.workspace }}/.cache/panels/tmp
      TEMP: ${{ github.workspace }}/.cache/panels/tmp
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/panels/browsers
      GLADOS_RUNTIME_DIR: ${{ github.workspace }}/.cache/panels
      GLADOS_BROWSER_CHECKIN: ${{ vars.GLADOS_BROWSER_CHECKIN || '1' }}
      GLADOS_BROWSER_REQUIRED: ${{ secrets.GLADOS_ACCOUNTS_JSON != '' && (inputs.verify_only || (!inputs.diagnose_only && (vars.GLADOS_BROWSER_CHECKIN || '1') != '0' && (vars.GLADOS_BROWSER_CHECKIN || '1') != 'false')) }}
      GLADOS_EMAIL_RECOVERY_ENABLED: ${{ secrets.GLADOS_GMAIL_ADDRESS != '' && secrets.GLADOS_GMAIL_APP_PASSWORD != '' && secrets.GLADOS_COOKIE_STORE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project runtime
        run: mkdir -p "$TMPDIR" "$PYTHONPATH" "$PIP_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-compile --target "$PYTHONPATH" -r panels/requirements.txt

      - name: Check native Chrome and virtual display
        if: ${{ env.GLADOS_BROWSER_REQUIRED == 'true' }}
        run: |
          command -v google-chrome
          command -v xvfb-run
          google-chrome --version

      - name: Run offline regression tests
        run: |
          python -B -m unittest discover -s panels -p 'test_*.py'
          python -B -m unittest discover -s nodeseek -p 'test_notify.py'
        env:
          GLADOS_BROWSER_CHECKIN: '0'
          GLADOS_VERIFY_ONLY: '0'
          GLADOS_BROWSER_TESTS: ${{ env.GLADOS_BROWSER_REQUIRED == 'true' && '1' || '0' }}

      - name: Restore encrypted GLaDOS sessions
        if: ${{ env.GLADOS_BROWSER_REQUIRED == 'true' && env.GLADOS_EMAIL_RECOVERY_ENABLED == 'true' && !inputs.diagnose_only }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/panels/sessions.enc
          key: glados-sessions-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: glados-sessions-v1-${{ github.ref_name }}-

      - name: Run checkin
        run: |
          if [ "$PANEL_DIAGNOSTIC_ONLY" = true ]
          then
            python -B panels/checkin.py
          elif [ "$GLADOS_BROWSER_REQUIRED" = true ]
          then
            xvfb-run -a --error-file=/dev/stderr python -B panels/checkin.py
          else
            python -B panels/checkin.py
          fi
        env:
          # 面板账号：变量为空即跳过该面板（面板清单见 panels/checkin.py 的 PANELS）
          GLADOS_ACCOUNTS_JSON: ${{ secrets.GLADOS_ACCOUNTS_JSON }}
          RAILGUN_ACCOUNTS_JSON: ${{ secrets.RAILGUN_ACCOUNTS_JSON }}
          # 旧 HTTP 方式的面板 UA（可选 vars，回退同名 Secret）；浏览器模式使用实际 UA。
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          RAILGUN_USER_AGENT: ${{ vars.RAILGUN_USER_AGENT || secrets.RAILGUN_USER_AGENT }}
          # GLaDOS 显式代理入口；浏览器模式留空时直连，不自动安装 WARP。
          GLADOS_PROXY_URL: ${{ secrets.GLADOS_PROXY_URL }}
          GLADOS_BROWSER_HEADLESS: 'false'
          GLADOS_BROWSER_CHANNEL: chrome
          GLADOS_BROWSER_TIMEOUT_SECONDS: ${{ vars.GLADOS_BROWSER_TIMEOUT_SECONDS || '120' }}
          GLADOS_VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
          # 可选邮箱恢复：复用原账号 JSON 的真实邮箱，不写回账号 Secrets。
          GLADOS_GMAIL_ADDRESS: ${{ secrets.GLADOS_GMAIL_ADDRESS }}
          GLADOS_GMAIL_APP_PASSWORD: ${{ secrets.GLADOS_GMAIL_APP_PASSWORD }}
          GLADOS_COOKIE_STORE_KEY: ${{ secrets.GLADOS_COOKIE_STORE_KEY }}
          GLADOS_GMAIL_SENDERS: ${{ vars.GLADOS_GMAIL_SENDERS }}
          GLADOS_GMAIL_WAIT_SECONDS: ${{ vars.GLADOS_GMAIL_WAIT_SECONDS || '120' }}
          # 仅提醒 GLaDOS 首次低奖励，不标记签到失败或自动补签；0 关闭提醒。
          GLADOS_LOW_REWARD_THRESHOLD: ${{ vars.GLADOS_LOW_REWARD_THRESHOLD }}
          # 请求层有限重试：空值使用脚本默认值（3 次，间隔 10/20 秒）
          PANEL_MAX_ATTEMPTS: ${{ vars.PANEL_MAX_ATTEMPTS }}
          PANEL_RETRY_DELAY_SECONDS: ${{ vars.PANEL_RETRY_DELAY_SECONDS }}
          PANEL_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
          # 通知渠道（全部可选，配了哪个推哪个，完整说明见 README「通知渠道」）
          # 下为全局渠道：所有站点共用；各站未配置站点级变量时回退到这里
          # PUSH_WEBHOOK_URL 为合并前面板仓库的旧变量，等同企业微信机器人渠道（WECOM_WEBHOOK 优先）
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
          TG_PROXY: ${{ secrets.TG_PROXY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PRIORITY: ${{ secrets.NTFY_PRIORITY }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
          # ---- 站点级覆盖（全部可选）：变量名前加面板前缀（GLADOS_ / RAILGUN_）后，
          # 该面板的推送改走自己的地址，未配置的渠道仍回退上方全局变量。
          # GLaDOS 与 Railgun 的企微地址：未单独配置各自的 *_WECOM_WEBHOOK 时，
          # 默认复用 PUSH_WEBHOOK_URL（两站同群的旧地址，不回退到全局 WECOM_WEBHOOK）；
          # 想换群就新建对应的 GLADOS_WECOM_WEBHOOK / RAILGUN_WECOM_WEBHOOK secret 覆盖。
          GLADOS_TG_BOT_TOKEN: ${{ secrets.GLADOS_TG_BOT_TOKEN }}
          GLADOS_TG_USER_ID: ${{ secrets.GLADOS_TG_USER_ID }}
          GLADOS_TG_API_HOST: ${{ secrets.GLADOS_TG_API_HOST }}
          GLADOS_TG_PROXY: ${{ secrets.GLADOS_TG_PROXY }}
          GLADOS_FEISHU_WEBHOOK: ${{ secrets.GLADOS_FEISHU_WEBHOOK }}
          GLADOS_DINGTALK_WEBHOOK: ${{ secrets.GLADOS_DINGTALK_WEBHOOK }}
          GLADOS_DINGTALK_SECRET: ${{ secrets.GLADOS_DINGTALK_SECRET }}
          GLADOS_WECOM_WEBHOOK: ${{ secrets.GLADOS_WECOM_WEBHOOK || secrets.PUSH_WEBHOOK_URL }}
          GLADOS_PUSH_WEBHOOK_URL: ${{ secrets.GLADOS_PUSH_WEBHOOK_URL }}
          GLADOS_WECOM_CORPID: ${{ secrets.GLADOS_WECOM_CORPID }}
          GLADOS_WECOM_CORPSECRET: ${{ secrets.GLADOS_WECOM_CORPSECRET }}
          GLADOS_WECOM_AGENTID: ${{ secrets.GLADOS_WECOM_AGENTID }}
          GLADOS_WECOM_TOUSER: ${{ secrets.GLADOS_WECOM_TOUSER }}
          GLADOS_BARK_URL: ${{ secrets.GLADOS_BARK_URL }}
          GLADOS_SERVERCHAN_KEY: ${{ secrets.GLADOS_SERVERCHAN_KEY }}
          GLADOS_PUSHPLUS_TOKEN: ${{ secrets.GLADOS_PUSHPLUS_TOKEN }}
          GLADOS_PUSHPLUS_TOPIC: ${{ secrets.GLADOS_PUSHPLUS_TOPIC }}
          GLADOS_NTFY_URL: ${{ secrets.GLADOS_NTFY_URL }}
          GLADOS_NTFY_TOPIC: ${{ secrets.GLADOS_NTFY_TOPIC }}
          GLADOS_NTFY_PRIORITY: ${{ secrets.GLADOS_NTFY_PRIORITY }}
          GLADOS_GOTIFY_URL: ${{ secrets.GLADOS_GOTIFY_URL }}
          GLADOS_GOTIFY_TOKEN: ${{ secrets.GLADOS_GOTIFY_TOKEN }}
          GLADOS_GOTIFY_PRIORITY: ${{ secrets.GLADOS_GOTIFY_PRIORITY }}
          RAILGUN_TG_BOT_TOKEN: ${{ secrets.RAILGUN_TG_BOT_TOKEN }}
          RAILGUN_TG_USER_ID: ${{ secrets.RAILGUN_TG_USER_ID }}
          RAILGUN_TG_API_HOST: ${{ secrets.RAILGUN_TG_API_HOST }}
          RAILGUN_TG_PROXY: ${{ secrets.RAILGUN_TG_PROXY }}
          RAILGUN_FEISHU_WEBHOOK: ${{ secrets.RAILGUN_FEISHU_WEBHOOK }}
          RAILGUN_DINGTALK_WEBHOOK: ${{ secrets.RAILGUN_DINGTALK_WEBHOOK }}
          RAILGUN_DINGTALK_SECRET: ${{ secrets.RAILGUN_DINGTALK_SECRET }}
          RAILGUN_WECOM_WEBHOOK: ${{ secrets.RAILGUN_WECOM_WEBHOOK || secrets.PUSH_WEBHOOK_URL }}
          RAILGUN_WECOM_CORPID: ${{ secrets.RAILGUN_WECOM_CORPID }}
          RAILGUN_WECOM_CORPSECRET: ${{ secrets.RAILGUN_WECOM_CORPSECRET }}
          RAILGUN_WECOM_AGENTID: ${{ secrets.RAILGUN_WECOM_AGENTID }}
          RAILGUN_WECOM_TOUSER: ${{ secrets.RAILGUN_WECOM_TOUSER }}
          RAILGUN_BARK_URL: ${{ secrets.RAILGUN_BARK_URL }}
          RAILGUN_SERVERCHAN_KEY: ${{ secrets.RAILGUN_SERVERCHAN_KEY }}
          RAILGUN_PUSHPLUS_TOKEN: ${{ secrets.RAILGUN_PUSHPLUS_TOKEN }}
          RAILGUN_PUSHPLUS_TOPIC: ${{ secrets.RAILGUN_PUSHPLUS_TOPIC }}
          RAILGUN_NTFY_URL: ${{ secrets.RAILGUN_NTFY_URL }}
          RAILGUN_NTFY_TOPIC: ${{ secrets.RAILGUN_NTFY_TOPIC }}
          RAILGUN_NTFY_PRIORITY: ${{ secrets.RAILGUN_NTFY_PRIORITY }}
          RAILGUN_GOTIFY_URL: ${{ secrets.RAILGUN_GOTIFY_URL }}
          RAILGUN_GOTIFY_TOKEN: ${{ secrets.RAILGUN_GOTIFY_TOKEN }}
          RAILGUN_GOTIFY_PRIORITY: ${{ secrets.RAILGUN_GOTIFY_PRIORITY }}

      - name: Save encrypted GLaDOS sessions
        if: ${{ always() && env.GLADOS_BROWSER_REQUIRED == 'true' && env.GLADOS_EMAIL_RECOVERY_ENABLED == 'true' && !inputs.diagnose_only && !inputs.verify_only && hashFiles('.cache/panels/sessions.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/panels/sessions.enc
          key: glados-sessions-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
