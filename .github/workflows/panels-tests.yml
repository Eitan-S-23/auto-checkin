name: panels-tests

on:
  push:
    branches: [main]
    paths:
      - 'panels/**'
      - 'nodeseek/notify.py'
      - 'nodeseek/test_notify.py'
      - '.github/workflows/panels-tests.yml'
  pull_request:
    paths:
      - 'panels/**'
      - 'nodeseek/notify.py'
      - 'nodeseek/test_notify.py'
      - '.github/workflows/panels-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panels-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/.cache/panels/deps
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/panels/pip
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      SSLKEYLOGFILE: ''
      TMPDIR: ${{ github.workspace }}/.cache/panels/tmp
      TMP: ${{ github.workspace }}/.cache/panels/tmp
      TEMP: ${{ github.workspace }}/.cache/panels/tmp
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/panels/browsers
      GLADOS_RUNTIME_DIR: ${{ github.workspace }}/.cache/panels
      GLADOS_BROWSER_CHECKIN: '0'
      GLADOS_VERIFY_ONLY: '0'
      GLADOS_MANUAL_SESSION_CACHE: '0'
      GLADOS_BROWSER_TESTS: '1'
      GLADOS_BROWSER_TEST_HEADLESS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare project runtime
        run: mkdir -p "$TMPDIR" "$PYTHONPATH" "$PIP_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-compile --target "$PYTHONPATH" -r panels/requirements.txt
      - name: Check native Chrome and virtual display
        run: |
          command -v google-chrome
          command -v xvfb-run
          google-chrome --version
      - name: Run offline regression tests
        run: |
          xvfb-run -a --error-file=/dev/stderr python -B -m unittest discover -s panels -p 'test_*.py'
          python -B -m unittest discover -s nodeseek -p 'test_notify.py'
