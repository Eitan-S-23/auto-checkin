name: daily-checkin (NodeSeek/DeepFlood/linux.sb)

on:
  # 支持在 Actions 页面手动触发，便于验证配置是否生效
  workflow_dispatch:
    inputs:
      linuxsb_force_browser:
        description: 'linux.sb 跳过 requests 探测直接走浏览器通道（验证兜底通道用）'
        type: boolean
        default: false
  schedule:
    - cron: '00 0 * * *'  # UTC 00:00，即北京时间 08:00

jobs:
  run-nodeseek-daily:
    runs-on: ubuntu-latest
    # 设定时区为北京时间，使脚本内 time.localtime/strftime 输出 UTC+8，
    # 通知里的"执行时间"不再显示 UTC，与签到自然日对齐。
    # 通知与站间延迟变量放在 job 级：NodeSeek 与 LinuxSB 两个步骤共用，
    # 避免同一组变量在两个步骤里重复声明。
    env:
      TZ: Asia/Shanghai
      # 两站签到间随机延迟范围（秒，默认 60-180），可调以降低被风控概率
      SITE_GAP_MIN: ${{ vars.SITE_GAP_MIN }}
      SITE_GAP_MAX: ${{ vars.SITE_GAP_MAX }}
      # 通知渠道（全部可选，配了哪个推哪个，完整说明见根目录 README「通知渠道」）
      # 下为全局渠道：所有站点共用；各站未配置站点级变量时回退到这里
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}
      TG_API_HOST: ${{ secrets.TG_API_HOST }}
      TG_PROXY: ${{ secrets.TG_PROXY }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
      WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}
      WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
      WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      NTFY_URL: ${{ secrets.NTFY_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_PRIORITY: ${{ secrets.NTFY_PRIORITY }}
      GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
      GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
      GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
      # ---- 站点级覆盖（全部可选）：变量名前加站点前缀（NODESEEK_ / LINUXSB_）后，
      # 该站的推送改走自己的地址，未配置的渠道仍回退上方全局变量。
      # 注意：NodeSeek 与 DeepFlood 为同一条汇总消息，渠道配置共用 NODESEEK_ 前缀。
      NODESEEK_TG_BOT_TOKEN: ${{ secrets.NODESEEK_TG_BOT_TOKEN }}
      NODESEEK_TG_USER_ID: ${{ secrets.NODESEEK_TG_USER_ID }}
      NODESEEK_TG_API_HOST: ${{ secrets.NODESEEK_TG_API_HOST }}
      NODESEEK_TG_PROXY: ${{ secrets.NODESEEK_TG_PROXY }}
      NODESEEK_FEISHU_WEBHOOK: ${{ secrets.NODESEEK_FEISHU_WEBHOOK }}
      NODESEEK_DINGTALK_WEBHOOK: ${{ secrets.NODESEEK_DINGTALK_WEBHOOK }}
      NODESEEK_DINGTALK_SECRET: ${{ secrets.NODESEEK_DINGTALK_SECRET }}
      NODESEEK_WECOM_WEBHOOK: ${{ secrets.NODESEEK_WECOM_WEBHOOK }}
      NODESEEK_PUSH_WEBHOOK_URL: ${{ secrets.NODESEEK_PUSH_WEBHOOK_URL }}
      NODESEEK_WECOM_CORPID: ${{ secrets.NODESEEK_WECOM_CORPID }}
      NODESEEK_WECOM_CORPSECRET: ${{ secrets.NODESEEK_WECOM_CORPSECRET }}
      NODESEEK_WECOM_AGENTID: ${{ secrets.NODESEEK_WECOM_AGENTID }}
      NODESEEK_WECOM_TOUSER: ${{ secrets.NODESEEK_WECOM_TOUSER }}
      NODESEEK_BARK_URL: ${{ secrets.NODESEEK_BARK_URL }}
      NODESEEK_SERVERCHAN_KEY: ${{ secrets.NODESEEK_SERVERCHAN_KEY }}
      NODESEEK_PUSHPLUS_TOKEN: ${{ secrets.NODESEEK_PUSHPLUS_TOKEN }}
      NODESEEK_PUSHPLUS_TOPIC: ${{ secrets.NODESEEK_PUSHPLUS_TOPIC }}
      NODESEEK_NTFY_URL: ${{ secrets.NODESEEK_NTFY_URL }}
      NODESEEK_NTFY_TOPIC: ${{ secrets.NODESEEK_NTFY_TOPIC }}
      NODESEEK_NTFY_PRIORITY: ${{ secrets.NODESEEK_NTFY_PRIORITY }}
      NODESEEK_GOTIFY_URL: ${{ secrets.NODESEEK_GOTIFY_URL }}
      NODESEEK_GOTIFY_TOKEN: ${{ secrets.NODESEEK_GOTIFY_TOKEN }}
      NODESEEK_GOTIFY_PRIORITY: ${{ secrets.NODESEEK_GOTIFY_PRIORITY }}
      LINUXSB_TG_BOT_TOKEN: ${{ secrets.LINUXSB_TG_BOT_TOKEN }}
      LINUXSB_TG_USER_ID: ${{ secrets.LINUXSB_TG_USER_ID }}
      LINUXSB_TG_API_HOST: ${{ secrets.LINUXSB_TG_API_HOST }}
      LINUXSB_TG_PROXY: ${{ secrets.LINUXSB_TG_PROXY }}
      LINUXSB_FEISHU_WEBHOOK: ${{ secrets.LINUXSB_FEISHU_WEBHOOK }}
      LINUXSB_DINGTALK_WEBHOOK: ${{ secrets.LINUXSB_DINGTALK_WEBHOOK }}
      LINUXSB_DINGTALK_SECRET: ${{ secrets.LINUXSB_DINGTALK_SECRET }}
      LINUXSB_WECOM_WEBHOOK: ${{ secrets.LINUXSB_WECOM_WEBHOOK }}
      LINUXSB_PUSH_WEBHOOK_URL: ${{ secrets.LINUXSB_PUSH_WEBHOOK_URL }}
      LINUXSB_WECOM_CORPID: ${{ secrets.LINUXSB_WECOM_CORPID }}
      LINUXSB_WECOM_CORPSECRET: ${{ secrets.LINUXSB_WECOM_CORPSECRET }}
      LINUXSB_WECOM_AGENTID: ${{ secrets.LINUXSB_WECOM_AGENTID }}
      LINUXSB_WECOM_TOUSER: ${{ secrets.LINUXSB_WECOM_TOUSER }}
      LINUXSB_BARK_URL: ${{ secrets.LINUXSB_BARK_URL }}
      LINUXSB_SERVERCHAN_KEY: ${{ secrets.LINUXSB_SERVERCHAN_KEY }}
      LINUXSB_PUSHPLUS_TOKEN: ${{ secrets.LINUXSB_PUSHPLUS_TOKEN }}
      LINUXSB_PUSHPLUS_TOPIC: ${{ secrets.LINUXSB_PUSHPLUS_TOPIC }}
      LINUXSB_NTFY_URL: ${{ secrets.LINUXSB_NTFY_URL }}
      LINUXSB_NTFY_TOPIC: ${{ secrets.LINUXSB_NTFY_TOPIC }}
      LINUXSB_NTFY_PRIORITY: ${{ secrets.LINUXSB_NTFY_PRIORITY }}
      LINUXSB_GOTIFY_URL: ${{ secrets.LINUXSB_GOTIFY_URL }}
      LINUXSB_GOTIFY_TOKEN: ${{ secrets.LINUXSB_GOTIFY_TOKEN }}
      LINUXSB_GOTIFY_PRIORITY: ${{ secrets.LINUXSB_GOTIFY_PRIORITY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      # runner 镜像（Ubuntu 24.04）已预装 Google Chrome 与匹配的 ChromeDriver，
      # 不要再 apt 安装 chromium-browser：该包在 24.04 上只是转发到 snap 的过渡包，
      # 装完得不到可用浏览器。这里只补装 xvfb 用于提供虚拟显示。
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          echo "Chrome version:"
          google-chrome --version
          echo "ChromeDriver version:"
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nodeseek/requirements.txt

      - name: Run NodeSeek script
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_RANDOM: ${{ vars.NS_RANDOM || secrets.NS_RANDOM }}
          # 在 xvfb 提供的虚拟显示下跑有头浏览器：headless 指纹会被 Cloudflare 拦在挑战页，
          # 有头模式指纹更接近真实用户，是目前能通过 5 秒盾的可行方式。
          HEADLESS: "false"
          # 除签到外的任务（评论、加鸡腿）总开关，未配置时默认关闭
          NS_EXTRA_TASKS: ${{ vars.NS_EXTRA_TASKS || secrets.NS_EXTRA_TASKS }}
          # deepflood 子站 cookie（可选，配置后两站顺序签到，中间自动随机延迟）
          # 注意 secret 名是 DEEPFLOOD_COOKIE（DEEP），须与拼写完全一致。
          DEEPFLOOD_COOKIE: ${{ secrets.DEEPFLOOD_COOKIE }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python nodeseek/nodeseek_daily.py

      # linux.sb（烧饼社区）2026-08 起会间歇性开启 Cloudflare 托管挑战：命中时
      # 非浏览器客户端收到 403 + Cf-Mitigated: challenge（本地住宅 IP、补全浏览器
      # 请求头、curl_cffi 各 impersonate 目标均实测被拦），故脚本被挑战时自动改用
      # 浏览器过盾再签到；未命中则走 requests 快通道。
      # 用 xvfb-run 提供虚拟显示，配合 HEADLESS=false 走有头浏览器，与 NodeSeek
      # 步骤同一配比（--headless=new 与 xvfb 叠加会令元素定位卡死）。
      - name: Run LinuxSB script
        env:
          # linux.sb 签到 cookie（可选，配置后三站顺序签到）
          LINUXSB_COOKIE: ${{ secrets.LINUXSB_COOKIE }}
          # 账号密码兜底登录（可选）：cookie 缺失或失效时自动登录，
          # 格式为 JSON：{"username":"xx","password":"yy"}
          LINUXSB_ACCOUNT: ${{ secrets.LINUXSB_ACCOUNT }}
          # 有头模式 + xvfb 虚拟显示（与 NodeSeek 步骤同配比），浏览器登录更稳定
          HEADLESS: "false"
          # 手动触发时可勾选，跳过 requests 探测直接验证浏览器通道；
          # 定时触发下 inputs 为空，保持 requests 快通道优先
          LINUXSB_FORCE_BROWSER: ${{ inputs.linuxsb_force_browser && '1' || '' }}
          # 通知渠道与 SITE_GAP_* 在 job 级 env 已注入，notify.py 读取同一组变量
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python nodeseek/linuxsb_daily.py
